# prep.config.yaml — prep toolchain source topology + embedding + PHI-gate config.
# SPEC §2.2. Credentials are NEVER inline: `dsnEnv` names an environment variable
# whose value is the DSN. Do not add secrets to this file.

bundleFormatVersion: "1.0.0"

embedding:
  provider: local # LOCAL ONLY — no external API (locked decision #2). Enforced by config.py at load time.
  modelId: bge-small-en-v1.5
  dimension: 384

sources:
  - sourceId: staging
    engine: postgres
    dsnEnv: STAGING_DSN # env var name; value is the DSN (never in repo)
    readOnly: true # enforced: default_transaction_read_only + SET TRANSACTION READ ONLY
    introspect:
      includeSchemas: ["Shared", "public", "ICU", "NICU", "VEM"]
      excludeSchemas: ["hangfire", "repack"]
      # Table-level filter (SCOPING + PHI-SURFACE CONTROL), layered UNDER the
      # schema filter above. Applied AFTER includeSchemas/excludeSchemas — a
      # table must first survive the schema filter, then this one. Patterns
      # are SCHEMA-QUALIFIED ("Schema.Table") and support fnmatch globs, e.g.
      # "Shared.Monitor*" matches Shared.MonitorMeasurements AND
      # Shared.Monitors but not Shared.Patients; "ICU.*" matches every table
      # in the ICU schema. Precedence: EXCLUDE WINS over include (same rule
      # as includeSchemas/excludeSchemas above). Leaving both empty (the
      # default) is fully backward compatible — every table in the selected
      # schemas is introspected, e.g. all ~942 Shared relations.
      #
      # EXAMPLE below narrows staging to a small, named set of Shared tables
      # instead of the full ~942-table Shared schema — useful when a task
      # only needs monitor-measurement data and there's no reason to
      # introspect/profile/PHI-classify hundreds of unrelated tables (faster
      # builds, smaller PHI surface). Uncomment to scope staging down:
      #
      # includeTables:
      #   - "Shared.Patients"
      #   - "Shared.MonitorMeasurements"
      #   - "Shared.MonitorMeasurementTypes"
      #   - "Shared.Acceptances"
      #   - "Shared.Monitors"
      # excludeTables: []
    profile:
      sampleRowsPerTable: 5000 # bounded scan; large tables get a time-windowed sample
      largeTableRowThreshold: 10000000
      timeWindowedSampleFor:
        - "Shared.MonitorMeasurements"
        - "Shared.VentilatorMeasurements"

  - sourceId: mock
    engine: postgres
    dsnEnv: MOCK_DSN
    readOnly: true
    introspect:
      includeSchemas: ["public"]
      excludeSchemas: []
    profile:
      sampleRowsPerTable: 5000
      # Mock topology (docs/mock-topology.md) seeds ~483 MeasurementsMock rows
      # — a shape-preserving, scaled-down ANALOG of staging's real ~337M-row
      # Shared.MonitorMeasurements, never the real cardinality (SPEC §8.1 "no
      # 337M-row synthetic data"). A 10M threshold (staging's value) would
      # never flag it, defeating the point of the analog: MeasurementsMock
      # exists specifically so `isLargeTimeSeries`/the cardinality guard have
      # something to exercise in CI without staging. 100 sits below the seed's
      # 483 rows so the flag fires structurally, same as the real table does
      # at real scale — see prep/prep/enrich/importance.py.
      largeTableRowThreshold: 100
      timeWindowedSampleFor: []

enrich:
  glossary: config/glossary.seed.yaml # hand-authored seed, extended by the tool
  inferJoinEdges:
    enabled: true
    minConfidence: 0.8
    nameMatchStrategy: "col-eq-pk"

phiGate:
  phiColumnset: reuse-phiScrubber # authoritative set = lib/phiScrubber.ts PHI_COLUMNS (§2.5)
  failOnViolation: true
