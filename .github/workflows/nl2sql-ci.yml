name: nl2sql-ci

# NL→SQL system CI (docs/NL2SQL_PLAN.md, docs/NL2SQL_SPEC.md §2.5, "CI integration").
# Three blocking jobs: ts-tests (Vitest), py-tests (pytest + PHI gate), eval (synthetic).
# P0 wires the skeleton: install deps + run the trivial tests. Later phases fill the TODOs.
# No job requires the SSH tunnel; staging is opt-in only (existing secret-scan.yml stays).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ts-tests:
    name: ts-tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Verify PHI bridge is in sync
        # Regenerating must be a no-op; a diff means someone edited PHI_COLUMNS
        # without running `npm run phi:sync` (SPEC §2.5 drift guard).
        run: |
          npm run phi:sync
          git diff --exit-code config/phi_columns.json
      - name: Run tests
        run: npm test
      # TODO(P2/M1): ensure lib/engine + lib/rag unit tests (incl. M1 thin slice) run here.
      # TODO(P5): route-level tests for app/api/sql-generate once the Retriever is wired.

  py-tests:
    name: py-tests (pytest + PHI gate)
    runs-on: ubuntu-latest
    # TODO(P3a): add a Postgres service container seeded with the P1 init SQL so the
    # introspection/profile/phi-gate build tests can run against a real (synthetic) source.
    #   services:
    #     postgres:
    #       image: postgres:16
    #       env: { POSTGRES_PASSWORD: postgres }
    #       ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install prep toolchain + test deps
        working-directory: prep
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run pytest
        working-directory: prep
        run: pytest -q
      # TODO(P3a/P3b): run the PHI gate build (`prep verify`) against the emitted bundle
      # and assert phiGate.passed=true + phiColumnsetHash matches config/phi_columns.json.

  eval:
    name: eval (synthetic golden subset)
    runs-on: ubuntu-latest
    # P6: runs eval/**/*.test.ts (eval/__tests__/eval.test.ts) in SYNTHETIC mode only — the
    # hermetic DuckDB topology (eval/synthetic/loadSynthetic.ts) + the recorded/stub driving
    # LLM (eval/fixtures/recordedLlm.ts, NL2SQL_PLAN.md §0a decision #3). No network, no
    # mock/staging DB, no model download (SPEC §6.3(a)). STAGING_DSN is deliberately left
    # UNSET in this job's environment so gated-staging mode (§6.3(b)) can never accidentally
    # activate in CI — runEval()/runAdversarial() fall back to synthetic when it's absent.
    # Retriever is exercised against the committed P4 fixture bundle's real catalog (a stand-
    # in for the full ~1,200-table schema in this context), not a hand-authored stub.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Run eval (synthetic mode, stub/recorded LLM)
        # Explicitly unset STAGING_DSN (defense in depth beyond "just don't set it in the
        # workflow env") so a stray runner-level env var can never gate staging mode on.
        env:
          STAGING_DSN: ''
        run: npx vitest run eval
