name: nl2sql-ci

# NL→SQL system CI (docs/NL2SQL_PLAN.md, docs/NL2SQL_SPEC.md §2.5, "CI integration";
# docs/PYTHON_NL2SQL_SERVICE_PLAN.md §5/§6 for the Python migration).
# Three blocking jobs: ts-tests (Vitest), py-tests (pytest + PHI gate), eval (Python, synthetic;
# authoritative as of Phase 5 — see the eval job's own comment for the TS-eval retirement note).
# P0 wires the skeleton: install deps + run the trivial tests. Later phases fill the TODOs.
# No job requires the SSH tunnel; staging is opt-in only (existing secret-scan.yml stays).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ts-tests:
    name: ts-tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Verify PHI bridge is in sync
        # Regenerating must be a no-op; a diff means someone edited PHI_COLUMNS
        # without running `npm run phi:sync` (SPEC §2.5 drift guard).
        run: |
          npm run phi:sync
          git diff --exit-code config/phi_columns.json
      - name: Run tests
        run: npm test
      # TODO(P2/M1): ensure lib/engine + lib/rag unit tests (incl. M1 thin slice) run here.
      # TODO(P5): route-level tests for app/api/sql-generate once the Retriever is wired.

  py-tests:
    name: py-tests (pytest + PHI gate)
    runs-on: ubuntu-latest
    # TODO(P3a): add a Postgres service container seeded with the P1 init SQL so the
    # introspection/profile/phi-gate build tests can run against a real (synthetic) source.
    #   services:
    #     postgres:
    #       image: postgres:16
    #       env: { POSTGRES_PASSWORD: postgres }
    #       ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Phase 1 (docs/PYTHON_NL2SQL_SERVICE_PLAN.md §3, §6): the local embedder,
      # PHI classification, aggregate-profile reducer, bundle loader, and
      # sqlglot SQL guard now live in the shared `ceiba_nl2sql` package, which
      # `prep` depends on by name ("ceiba-nl2sql") — install it FIRST so pip
      # can resolve that dependency locally (it is not published to PyPI).
      - name: Install shared ceiba_nl2sql library + test deps
        working-directory: ceiba_nl2sql
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run ceiba_nl2sql pytest (embedder, PHI, aggregate profile, bundle loader, SQL guard)
        working-directory: ceiba_nl2sql
        run: pytest -q
      - name: Install prep toolchain + test deps
        working-directory: prep
        run: |
          pip install -e ".[test]"
      - name: Run pytest
        working-directory: prep
        run: pytest -q
      # TODO(P3a/P3b): run the PHI gate build (`prep verify`) against the emitted bundle
      # and assert phiGate.passed=true + phiColumnsetHash matches config/phi_columns.json.

  eval:
    name: eval (Python, synthetic golden subset — authoritative)
    runs-on: ubuntu-latest
    # Phase 5 (docs/PYTHON_NL2SQL_SERVICE_PLAN.md §4.1, §5, §9): the eval harness has been
    # ported to Python (ceiba_nl2sql_eval/) and is now AUTHORITATIVE — this job runs the
    # Python eval, not the TS one. Runs ceiba_nl2sql_eval's pytest suite (mirrors
    # eval/__tests__/eval.test.ts's assertions) in SYNTHETIC mode only — the hermetic DuckDB
    # topology (ceiba_nl2sql_eval/synthetic.py) + the recorded/stub driving LLM
    # (ceiba_nl2sql_eval/recorded_llm.py). No network, no mock/staging DB, no model download.
    # STAGING_DSN is deliberately left UNSET in this job's environment so gated-staging mode
    # can never accidentally activate in CI — run_eval()/run_adversarial() fall back to
    # synthetic when it's absent. Retriever is exercised against the committed P4 fixture
    # bundle's real catalog (a stand-in for the full ~1,200-table schema in this context),
    # not a hand-authored stub.
    #
    # The TS eval (eval/**, eval/__tests__/eval.test.ts) is PENDING RETIREMENT in a later
    # phase (Phase 6, after a bake period) — it is NOT deleted yet and stays covered by
    # `npm test` in the ts-tests job above; this job does not touch eval/**.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install shared ceiba_nl2sql library
        working-directory: ceiba_nl2sql
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Install ceiba_nl2sql_eval + test deps
        working-directory: ceiba_nl2sql_eval
        run: pip install -e ".[test]"
      - name: Run ceiba_nl2sql_eval pytest (golden set, adversarial set, cost aggregation)
        working-directory: ceiba_nl2sql_eval
        # Explicitly unset STAGING_DSN (defense in depth beyond "just don't set it in the
        # workflow env") so a stray runner-level env var can never gate staging mode on.
        env:
          STAGING_DSN: ''
        run: pytest -q
      - name: Run the eval CLI once and print the EvalReport (so eval numbers show up in CI logs)
        working-directory: ceiba_nl2sql_eval
        env:
          STAGING_DSN: ''
        run: python -m ceiba_nl2sql_eval.cli
