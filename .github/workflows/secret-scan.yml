name: Secret Scan (gitleaks)

# Fails the build if a secret is detected in the code or in newly pushed
# commits. Uses the repo-local .gitleaks.toml (default rules + allowlist).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the whole commit range, not just
          # the tip. Important for catching secrets introduced in older commits.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Redact secret values from CI logs.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
